<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Buyer's Keywords</title>
    <link rel="icon" href="spm.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #faf9f6;
            --surface-color: #ffffff;
            --border-color: #e2dfdc;
            --border-focus: #5e7f79;
            --text-main: #2c2a29;
            --text-muted: #6e6963;
            --accent: #1a1918;
            --accent-hover: #383532;
            --header-color: #245c57;
            --success: #2e7d32;
            --font-serif: "Newsreader", Georgia, serif;
            --font-sans: "Plus Jakarta Sans", "Noto Sans Bengali", sans-serif;
            --font-bengali: "Noto Sans Bengali", sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            min-height: 100vh;
            padding: 40px 20px;
            background: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .document-container {
            width: min(100%, 860px);
            margin: 0 auto;
            padding: 48px 40px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, .02);
        }

        .doc-header {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .doc-title {
            margin-bottom: 8px;
            color: var(--header-color);
            font-family: var(--font-serif);
            font-size: clamp(2rem, 5vw, 2.5rem);
            font-weight: 600;
            line-height: 1.12;
        }

        .doc-subtitle { color: var(--text-muted); font-size: .98rem; }

        .section-heading {
            margin: 36px 0 16px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
            color: var(--accent);
            font-family: var(--font-serif);
            font-size: 1.35rem;
            font-weight: 600;
        }

        .input-group { margin-bottom: 20px; }

        .input-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-main);
            font-family: var(--font-bengali);
            font-size: .98rem;
            font-weight: 600;
        }

        .doc-input, .prompt-preview {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-family: var(--font-bengali);
            font-size: .96rem;
            line-height: 1.65;
            resize: vertical;
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
        }

        .doc-input { min-height: 150px; padding: 14px 16px; background: var(--bg-color); }

        .doc-input:focus {
            outline: none;
            border-color: var(--border-focus);
            background: var(--surface-color);
            box-shadow: 0 0 0 3px rgba(94, 127, 121, .12);
        }

        .input-actions, .output-actions { display: flex; justify-content: flex-end; margin-top: 10px; }

        button {
            border: 0;
            border-radius: 6px;
            padding: 10px 18px;
            font-family: var(--font-sans);
            font-size: .85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s ease, transform .1s ease;
        }

        button:active { transform: translateY(1px); }
        .reset-btn { background: #ece9e4; color: var(--text-main); }
        .reset-btn:hover { background: #dedad3; }

        .output-card {
            padding: 24px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-color);
        }

        .output-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
        .output-title { color: var(--accent); font-family: var(--font-serif); font-size: 1.15rem; font-weight: 600; }
        .prompt-preview { min-height: 780px; padding: 16px; background: var(--surface-color); white-space: pre-wrap; }
        .copy-btn { background: var(--accent); color: #fff; }
        .copy-btn:hover { background: var(--accent-hover); }
        .copy-btn.copied { background: var(--success); }

        .doc-footer {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: .85rem;
            text-align: center;
        }

        @media (max-width: 640px) {
            body { padding: 12px 8px; }
            .document-container { padding: 28px 18px; }
            .doc-header { margin-bottom: 30px; padding-bottom: 22px; }
            .output-card { padding: 16px; }
            .prompt-preview { min-height: 640px; }
        }
    </style>
</head>
<body>
    <main class="document-container">
        <header class="doc-header">
            <h1 class="doc-title">Find Buyer's Keywords</h1>
            <p class="doc-subtitle">(for blog post)</p>
        </header>

        <section aria-labelledby="input-heading">
            <h2 class="section-heading" id="input-heading">Keyword Input</h2>
            <div class="input-group">
                <label class="input-label" for="keywordInput">[Insert Keyword Here]</label>
                <textarea id="keywordInput" class="doc-input" placeholder="Insert Keyword Here" oninput="updatePrompt()"></textarea>
                <div class="input-actions">
                    <button class="reset-btn" type="button" onclick="resetKeyword()">Reset</button>
                </div>
            </div>
        </section>

        <section aria-labelledby="prompt-heading">
            <h2 class="section-heading" id="prompt-heading">Prompt</h2>
            <div class="output-card">
                <div class="output-header"><span class="output-title">Live Prompt Preview</span></div>
                <textarea id="promptOutput" class="prompt-preview" readonly aria-label="Generated prompt"></textarea>
                <div class="output-actions"><button class="copy-btn" type="button" onclick="copyPrompt()">Copy Prompt</button></div>
            </div>
        </section>

        <footer class="doc-footer">
            Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.
        </footer>
    </main>

    <script>
        const placeholder = '[Insert Keyword Here]';
        const promptTemplate = `Answer the following prompt in Bengali (India).

Rules:
- Use only Bengali (India).
- Always address the reader as "আপনি".
- Never use "তুমি" or "তুই".
- Use a natural Kolkata-style conversational tone.
- Use natural, modern Bengali (India).
- Avoid Bangladeshi vocabulary, spelling, and expressions.

PROMPT

You are an expert SEO strategist, search-intent analyst, and content strategist.

Your job is to generate 25 high-intent buyer keywords strictly tailored to a blog post built around the keyword provided below.

The goal is NOT to generate generic keywords around a niche.

The goal is to identify realistic search queries from people who are actively looking for information, solutions, methods, tools, products, or services related to the given keyword — especially people who may become buyers after reading a genuinely useful blog post.

PRIMARY KEYWORD:
[Keyword]


KEYWORD SELECTION PRINCIPLES

Every keyword must satisfy all of the following:

1. RELEVANCE

The keyword must have a clear and direct relationship with the Primary Keyword.

2. BLOG RELEVANCE

The keyword must represent a search query that can naturally be answered through a useful, focused blog post.

3. BUYER PROXIMITY

Prioritize searchers who have a real problem, specific need, solution interest, comparison need, or practical intention that could eventually lead to a purchase.

4. SEARCH INTENT

The keyword must reveal a meaningful information need, problem, solution search, comparison, evaluation, or buying consideration.

5. SPECIFICITY

Prefer specific long-tail keywords over broad generic terms.

6. NATURAL SEARCH LANGUAGE

Write keywords as realistic phrases that a person might actually type into Google.

7. NO GENERIC KEYWORDS

Do not include broad keywords merely because they are related to the Primary Keyword.

8. NO CONTENT INPUT ASSUMPTION

Do not assume that the user has provided a blog post, sales page, product description, offer, or other content.

Analyse the Primary Keyword itself and infer the most commercially relevant search journeys around it.

9. BUYER INTENT WITHOUT FORCED COMMERCIAL WORDS

Do not force words such as "buy", "price", or "best product" into every keyword.

A keyword can have strong buyer potential even when the searcher is still researching a problem or solution.

10. STRICT TOPICAL CONNECTION

Every keyword must remain clearly connected to the Primary Keyword.

Avoid drifting into loosely related topics.

11. INFORMATION VALUE

For every keyword, identify what information the searcher actually needs.

Do not merely describe the search intent. Determine the specific information that a useful blog post should provide to satisfy that intent.


GENERATE 25 KEYWORDS ACROSS THESE 5 INTENT GROUPS


CATEGORY 1 — PROBLEM-AWARE BUYER KEYWORDS

The searcher knows they have a problem related to the Primary Keyword and is actively looking for a solution.

Focus on specific problems, frustrations, obstacles, failures, or unmet needs that could eventually lead to buying a solution.

Generate 5 keywords.


CATEGORY 2 — SOLUTION-AWARE BUYER KEYWORDS

The searcher understands that a solution exists and is exploring methods, approaches, tools, services, or solution types related to the Primary Keyword.

Generate 5 keywords.


CATEGORY 3 — EVALUATION & COMPARISON KEYWORDS

The searcher is evaluating possible solutions and is getting closer to making a decision.

Include comparison, suitability, effectiveness, alternatives, features, or "which one" type searches where appropriate.

Generate 5 keywords.


CATEGORY 4 — QUESTION-BASED BUYER KEYWORDS

Generate realistic questions that people may search on Google when they have a specific problem, need, or decision related to the Primary Keyword.

The questions must have meaningful commercial relevance, even if the searcher is not immediately ready to buy.

Generate 5 keywords.


CATEGORY 5 — HIGH-INTENT ACTION KEYWORDS

The searcher is closest to taking action.

Focus on searches indicating strong intent to choose, start, use, invest in, hire, purchase, or adopt a solution related to the Primary Keyword.

Generate 5 keywords.


IMPORTANT FILTER

Before including any keyword, ask:

"Could this searcher realistically become a buyer after consuming a genuinely useful blog post targeting this query?"

If the answer is no, reject the keyword.

Do not prioritize search volume alone.

Prioritize:

Relevance + Intent + Buyer Proximity + Blog Potential + Information Value.


OUTPUT FORMAT

For every keyword, provide exactly these five elements:

1. KEYWORD
The search query.

2. SEARCHER INTENT
Clearly explain what the searcher is trying to achieve by making this search.

Do not simply repeat the keyword.

Explain the underlying information need, problem, decision, or desired outcome behind the search.

3. BUYER SIGNAL
Explain why this searcher may have commercial potential and how close they appear to a buying decision.

4. BLOG INFORMATION TO SUPPLY
Specify exactly what information the blog post should provide to satisfy the searcher's intent.

Do not give a vague description such as "provide useful information."

Identify the specific information, explanation, comparison, steps, criteria, examples, warnings, or decision guidance that should be included.

5. SUGGESTED BLOG ANGLE
Describe the most useful angle from which the blog post should address this keyword.

The blog angle must directly satisfy the searcher's intent and should naturally move the reader toward a better-informed decision.


CATEGORY 1 — PROBLEM-AWARE BUYER KEYWORDS

1. [KEYWORD]

Searcher Intent:
[What the searcher is actually trying to understand, solve, or achieve]

Buyer Signal:
[Why this searcher has potential to become a buyer]

Blog Information to Supply:
[The specific information the blog should provide to satisfy this search]

Suggested Blog Angle:
[The most useful angle for the blog post]


2. [KEYWORD]

Searcher Intent:
[...]

Buyer Signal:
[...]

Blog Information to Supply:
[...]

Suggested Blog Angle:
[...]

Continue until 5 keywords are completed.


CATEGORY 2 — SOLUTION-AWARE BUYER KEYWORDS

6. [KEYWORD]

Searcher Intent:
[...]

Buyer Signal:
[...]

Blog Information to Supply:
[...]

Suggested Blog Angle:
[...]

Continue until 5 keywords are completed.


CATEGORY 3 — EVALUATION & COMPARISON KEYWORDS

11. [KEYWORD]

Searcher Intent:
[...]

Buyer Signal:
[...]

Blog Information to Supply:
[...]

Suggested Blog Angle:
[...]

Continue until 5 keywords are completed.


CATEGORY 4 — QUESTION-BASED BUYER KEYWORDS

16. [KEYWORD]

Searcher Intent:
[...]

Buyer Signal:
[...]

Blog Information to Supply:
[...]

Suggested Blog Angle:
[...]

Continue until 5 keywords are completed.


CATEGORY 5 — HIGH-INTENT ACTION KEYWORDS

21. [KEYWORD]

Searcher Intent:
[...]

Buyer Signal:
[...]

Blog Information to Supply:
[...]

Suggested Blog Angle:
[...]

Continue until 5 keywords are completed.


FINAL SELECTION — TOP 5

After generating all 25 keywords, select the 5 keywords that best balance:

1. Strong relevance to the Primary Keyword
2. Clear buyer intent
3. Strong problem or solution relevance
4. High potential for a useful blog post
5. Strong information value
6. Natural opportunity to lead the reader toward a relevant product, service, or solution

For each of the Top 5, provide:

Keyword:
[Keyword]

Buyer Stage:
[Problem-aware / Solution-aware / Evaluation / High-intent action]

Primary Intent:
[The main thing the searcher wants to accomplish]

Essential Blog Information:
[The most important information the blog must provide]

Suggested Blog Post Angle:
[Recommended content angle]

Suggested Blog Post Title:
[An appropriate blog post title that directly addresses the search intent]


FINAL CHECK

Before delivering the answer, verify that:

1. There are exactly 25 keywords.
2. There are exactly 5 keywords in each category.
3. Every keyword is directly related to the Primary Keyword.
4. Every keyword has a clear searcher intent.
5. Every keyword has identifiable buyer potential.
6. Every keyword has specific information that a blog post should supply.
7. The Blog Information to Supply is specific and actionable, not generic.
8. The suggested blog angle directly matches the search intent.
9. The keywords are suitable for blog content rather than being purely transactional keywords.
10. The 5 selected Top Picks represent the strongest opportunities for attracting potential buyers through useful blog content.

PRIMARY KEYWORD TO ANALYSE:

[Insert Keyword Here]`;

        function updatePrompt() {
            const keyword = document.getElementById('keywordInput').value;
            const placeholderIndex = promptTemplate.lastIndexOf(placeholder);
            const prompt = keyword
                ? promptTemplate.slice(0, placeholderIndex) + keyword + promptTemplate.slice(placeholderIndex + placeholder.length)
                : promptTemplate;

            document.getElementById('promptOutput').value = prompt;
        }

        function resetKeyword() {
            document.getElementById('keywordInput').value = '';
            updatePrompt();
            document.getElementById('keywordInput').focus();
        }

        async function copyPrompt() {
            const output = document.getElementById('promptOutput');
            const button = document.querySelector('.copy-btn');

            try {
                await navigator.clipboard.writeText(output.value);
                const originalText = button.textContent;
                button.textContent = 'Copied!';
                button.classList.add('copied');

                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove('copied');
                }, 1800);
            } catch (error) {
                output.select();
                document.execCommand('copy');
            }
        }

        updatePrompt();
    </script>
</body>
</html>
