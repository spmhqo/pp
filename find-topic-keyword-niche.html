<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Topic, Keyword, and Niche</title>
    <link rel="icon" href="spm.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #faf9f6;
            --surface-color: #ffffff;
            --border-color: #e2dfdc;
            --border-focus: #5e7f79;
            --text-main: #2c2a29;
            --text-muted: #6e6963;
            --accent: #1a1918;
            --accent-hover: #383532;
            --header-color: #245c57;
            --success: #2e7d32;
            --font-serif: "Newsreader", Georgia, serif;
            --font-sans: "Plus Jakarta Sans", "Noto Sans Bengali", sans-serif;
            --font-bengali: "Noto Sans Bengali", sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html { scroll-behavior: smooth; }

        body {
            min-height: 100vh;
            padding: 40px 20px;
            background: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .document-container {
            width: min(100%, 860px);
            margin: 0 auto;
            padding: 48px 40px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, .02);
        }

        .doc-header {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .doc-title {
            margin-bottom: 8px;
            color: var(--header-color);
            font-family: var(--font-serif);
            font-size: clamp(2rem, 5vw, 2.5rem);
            font-weight: 600;
            letter-spacing: 0;
            line-height: 1.12;
        }

        .doc-subtitle {
            color: var(--text-muted);
            font-size: .98rem;
        }

        .section-heading {
            margin: 36px 0 16px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
            color: var(--accent);
            font-family: var(--font-serif);
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: 0;
        }

        .input-group { margin-bottom: 20px; }

        .input-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-main);
            font-family: var(--font-bengali);
            font-size: .98rem;
            font-weight: 600;
        }

        .doc-input, .prompt-preview {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-family: var(--font-bengali);
            font-size: .96rem;
            line-height: 1.65;
            resize: vertical;
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
        }

        .doc-input {
            min-height: 150px;
            padding: 14px 16px;
            background: var(--bg-color);
        }

        .doc-input:focus {
            outline: none;
            border-color: var(--border-focus);
            background: var(--surface-color);
            box-shadow: 0 0 0 3px rgba(94, 127, 121, .12);
        }

        .input-actions, .output-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 10px 18px;
            font-family: var(--font-sans);
            font-size: .85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s ease, transform .1s ease;
        }

        button:active { transform: translateY(1px); }

        .reset-btn {
            background: #ece9e4;
            color: var(--text-main);
        }

        .reset-btn:hover { background: #dedad3; }

        .output-card {
            padding: 24px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-color);
        }

        .output-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 12px;
        }

        .output-title {
            color: var(--accent);
            font-family: var(--font-serif);
            font-size: 1.15rem;
            font-weight: 600;
        }

        .prompt-preview {
            min-height: 540px;
            padding: 16px;
            background: var(--surface-color);
            white-space: pre-wrap;
        }

        .copy-btn {
            background: var(--accent);
            color: #fff;
        }

        .copy-btn:hover { background: var(--accent-hover); }
        .copy-btn.copied { background: var(--success); }

        .doc-footer {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: .85rem;
            text-align: center;
        }

        @media (max-width: 640px) {
            body { padding: 12px 8px; }
            .document-container { padding: 28px 18px; }
            .doc-header { margin-bottom: 30px; padding-bottom: 22px; }
            .output-card { padding: 16px; }
            .prompt-preview { min-height: 480px; }
        }
    </style>
</head>
<body>
    <main class="document-container">
        <header class="doc-header">
            <h1 class="doc-title">Find Topic, Keyword, and Niche</h1>
            <p class="doc-subtitle">(of a content)</p>
        </header>

        <section aria-labelledby="input-heading">
            <h2 class="section-heading" id="input-heading">Content Input</h2>
            <div class="input-group">
                <label class="input-label" for="contentInput">[এখানে content paste করুন]</label>
                <textarea id="contentInput" class="doc-input" placeholder="এখানে content paste করুন" oninput="updatePrompt()"></textarea>
                <div class="input-actions">
                    <button class="reset-btn" type="button" onclick="resetContent()">Reset</button>
                </div>
            </div>
        </section>

        <section aria-labelledby="prompt-heading">
            <h2 class="section-heading" id="prompt-heading">Prompt</h2>
            <div class="output-card">
                <div class="output-header">
                    <span class="output-title">Live Prompt Preview</span>
                </div>
                <textarea id="promptOutput" class="prompt-preview" readonly aria-label="Generated prompt"></textarea>
                <div class="output-actions">
                    <button class="copy-btn" type="button" onclick="copyPrompt()">Copy Prompt</button>
                </div>
            </div>
        </section>

        <footer class="doc-footer">
            Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.
        </footer>
    </main>

    <script>
        const dynamicPlaceholder = '[এখানে content paste করুন]';
        const promptTemplate = `আপনি একটি নির্দিষ্ট content বিশ্লেষণ করে তার Niche, Keyword এবং Central Topic of Discussion শনাক্ত করবেন।

প্রথমে নিচের তিনটি term-এর সংজ্ঞা ও পার্থক্য ভালোভাবে বুঝে নিন:

Niche

Niche হলো content-এর বৃহত্তর subject territory বা ক্ষেত্র। এটি একটি নির্দিষ্ট content-এর বিষয় নয়; বরং contentটি কোন বৃহত্তর domain, problem area বা subject area-এর অন্তর্গত তা নির্দেশ করে।

সহজভাবে:
Niche = Content Territory

অর্থাৎ, “আমি কোন বৃহত্তর ক্ষেত্র নিয়ে কাজ করছি?”


Keyword

Keyword হলো সেই শব্দ বা phrase, যা একটি নির্দিষ্ট information need, topic বা search intent-কে প্রকাশ করে। এটি সাধারণত মানুষ কোনো বিষয় সম্পর্কে জানতে বা খুঁজতে যে শব্দ বা phrase ব্যবহার করতে পারে তাকে নির্দেশ করে।

সহজভাবে:
Keyword = Search Language

অর্থাৎ, “মানুষ কী শব্দ বা phrase দিয়ে এই বিষয়টি খুঁজতে পারে?”


Central Topic of Discussion

Central Topic of Discussion হলো একটি নির্দিষ্ট content-এর মধ্যে যে বিষয়টিকে কেন্দ্র করে পুরো discussion unfold হয়। এটি content-এর সবচেয়ে নির্দিষ্ট intellectual centre—অর্থাৎ, এই particular content-এ আসলে কোন বিষয়টি নিয়ে আলোচনা হচ্ছে।

সহজভাবে:
Central Topic of Discussion = Discussion Centre

অর্থাৎ, “এই content-এ আসলে কোন নির্দিষ্ট বিষয়টি নিয়ে আলোচনা করা হচ্ছে?”


তিনটির পার্থক্য মনে রাখুন:

Niche → আমি কোন বৃহত্তর ক্ষেত্র নিয়ে কাজ করছি?
Keyword → মানুষ কী শব্দ বা phrase দিয়ে এই বিষয়টি খুঁজছে?
Central Topic of Discussion → এই particular content-এ আসলে কোন নির্দিষ্ট বিষয়টি নিয়ে আলোচনা হচ্ছে?

আরও সংক্ষেপে:

Niche determines the territory.
Keyword identifies the search entry point.
Central Topic determines the intellectual centre of the content.


TASK

নিচের contentটি গভীরভাবে বিশ্লেষণ করুন এবং contentটির জন্য:

1. Niche
2. Primary Keyword
3. Central Topic of Discussion

শনাক্ত করুন।

বিশ্লেষণের সময় এই নিয়মগুলি অনুসরণ করুন:

1. Niche যেন অতিরিক্ত broad বা অতিরিক্ত narrow না হয়। Contentটির প্রকৃত বৃহত্তর subject territory নির্ধারণ করুন।

2. Primary Keyword হিসেবে এমন একটি শব্দ বা phrase নির্বাচন করুন, যা contentটির মূল search topic বা information need-কে সবচেয়ে ভালোভাবে প্রকাশ করে। শুধু content-এ সবচেয়ে বেশি ব্যবহৃত শব্দকে keyword হিসেবে নির্বাচন করবেন না।

3. Central Topic of Discussion যেন শুধু একটি keyword-এর পুনরাবৃত্তি না হয়। Contentটির মধ্যে যে নির্দিষ্ট বিষয়টি নিয়ে মূল discussion তৈরি হয়েছে, সেটি নির্ধারণ করুন।

4. Content-এ একাধিক বিষয় থাকলে দেখুন কোন বিষয়টি অন্য বিষয়গুলিকে organise বা connect করছে। সেটিকেই Central Topic of Discussion হিসেবে অগ্রাধিকার দিন।

5. Content-এর title, opening, body, examples, arguments, questions এবং conclusion—সবকিছুর relationship বিবেচনা করুন।

6. নিজের পক্ষ থেকে এমন কোনো বিষয় যোগ করবেন না যা content-এ যথেষ্টভাবে supported নয়।

7. Keyword এবং Central Topic of Discussion এক হয়ে গেলে সেটি কেন হয়েছে তা ব্যাখ্যা করুন। জোর করে দুটিকে আলাদা করবেন না।

8. Niche, Keyword এবং Central Topic—এই তিনটি যেন একই level-এর concept না হয়। প্রত্যেকটির আলাদা role বজায় রাখুন।


OUTPUT FORMAT

Niche:
[নির্ধারিত Niche]

Why:
[কেন এটি contentটির বৃহত্তর subject territory—সংক্ষেপে ব্যাখ্যা করুন]

Primary Keyword:
[নির্ধারিত primary keyword]

Why:
[কেন এই keyword contentটির মূল search topic বা information need-কে সবচেয়ে ভালোভাবে প্রকাশ করে—সংক্ষেপে ব্যাখ্যা করুন]

Central Topic of Discussion:
[contentটির নির্দিষ্ট discussion centre]

Why:
[কেন এটিই contentটির মূল discussion centre—সংক্ষেপে ব্যাখ্যা করুন]


RELATIONSHIP

শেষে তিনটির relationship এক লাইনে দেখান:

Niche → Keyword → Central Topic of Discussion

তারপর এক লাইনে ব্যাখ্যা করুন:

“Niche” contentটির বৃহত্তর territory, “Keyword” তার search entry point, এবং “Central Topic of Discussion” হলো এই particular content-এর intellectual centre।


CONTENT TO ANALYZE

[এখানে content paste করুন]`;

        function updatePrompt() {
            const content = document.getElementById('contentInput').value;
            const placeholderIndex = promptTemplate.lastIndexOf(dynamicPlaceholder);
            const prompt = content
                ? promptTemplate.slice(0, placeholderIndex) + content + promptTemplate.slice(placeholderIndex + dynamicPlaceholder.length)
                : promptTemplate;
            document.getElementById('promptOutput').value = prompt;
        }

        function resetContent() {
            document.getElementById('contentInput').value = '';
            updatePrompt();
            document.getElementById('contentInput').focus();
        }

        async function copyPrompt() {
            const output = document.getElementById('promptOutput');
            const button = document.querySelector('.copy-btn');
            try {
                await navigator.clipboard.writeText(output.value);
                const originalText = button.textContent;
                button.textContent = 'Copied!';
                button.classList.add('copied');
                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove('copied');
                }, 1800);
            } catch (error) {
                output.select();
                document.execCommand('copy');
            }
        }

        updatePrompt();
    </script>
</body>
</html>
