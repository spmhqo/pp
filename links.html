<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Generator</title>
    <link rel="icon" href="spm.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #faf9f6;
            --surface-color: #ffffff;
            --border-color: #e2dfdc;
            --border-focus: #706b63;
            --text-main: #2c2a29;
            --text-muted: #6e6963;
            --accent: #1a1918;
            --accent-hover: #383532;
            --success: #2e7d32;
            --header-color: #4338ca;
            --font-serif: 'Newsreader', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .document-container {
            max-width: 760px;
            margin: 0 auto;
            padding: 48px 40px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02);
        }

        .doc-header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
        }

        .doc-title {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--header-color);
            margin-bottom: 8px;
        }

        .doc-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .section-heading {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent);
            margin: 36px 0 16px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .doc-input {
            flex: 1;
            width: 100%;
            min-height: 88px;
            padding: 12px 16px;
            resize: vertical;
            font: 0.95rem var(--font-sans);
            color: var(--text-main);
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .doc-input:focus {
            outline: none;
            border-color: var(--border-focus);
            background: var(--surface-color);
            box-shadow: 0 0 0 3px rgba(112, 107, 99, 0.1);
        }

        .reset-btn,
        .copy-btn {
            border: 0;
            border-radius: 6px;
            padding: 10px 16px;
            font: 500 0.85rem var(--font-sans);
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .reset-btn {
            color: var(--text-main);
            background: #ece9e5;
        }

        .reset-btn:hover {
            background: #ddd8d2;
        }

        .copy-btn {
            color: #fff;
            background: var(--accent);
        }

        .copy-btn:hover {
            background: var(--accent-hover);
        }

        .copy-btn.copied {
            background: var(--success);
        }

        .output-card {
            margin-top: 30px;
            padding: 24px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .output-header {
            margin-bottom: 12px;
        }

        .output-title {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
        }

        .prompt-preview {
            width: 100%;
            min-height: 120px;
            margin-bottom: 16px;
            padding: 16px;
            resize: vertical;
            font: 0.9rem/1.5 var(--font-sans);
            color: var(--text-main);
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            white-space: pre-wrap;
        }

        .doc-footer {
            margin-top: 50px;
            padding-top: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
        }

        @media (max-width: 640px) {
            body {
                padding: 12px 8px;
            }

            .document-container {
                padding: 24px 16px;
            }

            .doc-title {
                font-size: 1.8rem;
            }

            .input-row {
                flex-direction: column;
            }

            .reset-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="document-container">
        <header class="doc-header">
            <h1 class="doc-title">Link Generator</h1>
            <p class="doc-subtitle">(for index page)</p>
        </header>

        <section aria-labelledby="inputs-heading">
            <h2 id="inputs-heading" class="section-heading">1. Variables &amp; Inputs</h2>

            <div class="input-group">
                <label class="input-label" for="linkInput">[link]</label>
                <div class="input-row">
                    <textarea id="linkInput" class="doc-input" placeholder="Enter link" oninput="updatePrompts()"></textarea>
                    <button class="reset-btn" type="button" onclick="resetInput('linkInput')">Reset</button>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label" for="buttonTextInput">[Button Text]</label>
                <div class="input-row">
                    <textarea id="buttonTextInput" class="doc-input" placeholder="Enter button text" oninput="updatePrompts()"></textarea>
                    <button class="reset-btn" type="button" onclick="resetInput('buttonTextInput')">Reset</button>
                </div>
            </div>
        </section>

        <section aria-labelledby="output-heading">
            <h2 id="output-heading" class="section-heading">2. Generated Output Prompt</h2>

            <article class="output-card">
                <div class="output-header">
                    <span class="output-title">Prompt 1</span>
                </div>

                <textarea id="promptOutput" class="prompt-preview" readonly aria-label="Generated prompt"></textarea>
                <button class="copy-btn" type="button" onclick="copyPrompt()">Copy to Clipboard</button>
            </article>
        </section>

        <footer class="doc-footer">
            Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.
        </footer>
    </main>

    <script>
        const promptTemplate = '<a class="button" href="[link]" target="_blank" rel="noopener">[Button Text]</a>';

        function updatePrompts() {
            const link = document.getElementById('linkInput').value || '[link]';
            const buttonText = document.getElementById('buttonTextInput').value || '[Button Text]';

            document.getElementById('promptOutput').value = promptTemplate
                .replace('[link]', link)
                .replace('[Button Text]', buttonText);
        }

        function resetInput(inputId) {
            document.getElementById(inputId).value = '';
            updatePrompts();
        }

        async function copyPrompt() {
            const output = document.getElementById('promptOutput');
            const button = document.querySelector('.copy-btn');

            try {
                await navigator.clipboard.writeText(output.value);
            } catch (error) {
                output.select();
                document.execCommand('copy');
                window.getSelection().removeAllRanges();
            }

            const originalText = button.textContent;
            button.textContent = '✓ Copied!';
            button.classList.add('copied');

            setTimeout(() => {
                button.textContent = originalText;
                button.classList.remove('copied');
            }, 2000);
        }

        updatePrompts();
    </script>
</body>
</html>
