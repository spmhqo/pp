<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ice Cold Traffic Project prompt workspace for promoting a digital product.">
    <title>Ice Cold Traffic Project</title>
    <link rel="icon" href="spm.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #faf9f6;
            --surface-color: #ffffff;
            --border-color: #e2dfdc;
            --border-focus: #706b63;
            --text-main: #2c2a29;
            --text-muted: #6e6963;
            --accent: #1a1918;
            --accent-hover: #383532;
            --success: #2e7d32;
            --header-color: #4338ca;
            --font-serif: 'Newsreader', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }
        .document-container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 48px 40px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02);
        }
        .doc-header {
            text-align: center;
            margin-bottom: 36px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 30px;
        }
        .doc-title {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--header-color);
            margin-bottom: 8px;
        }
        .doc-subtitle { font-size: 0.95rem; color: var(--text-muted); font-weight: 400; }
        .section-heading {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent);
            margin: 32px 0 16px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
        }
        .input-group { margin-bottom: 20px; }
        .input-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }
        .doc-input, .prompt-box {
            display: block;
            width: 100%;
            padding: 14px 16px;
            font-family: var(--font-sans);
            font-size: 0.93rem;
            color: var(--text-main);
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            resize: vertical;
            min-height: 100px;
            line-height: 1.65;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .doc-input:focus, .prompt-box:focus {
            outline: none;
            border-color: var(--border-focus);
            background: var(--surface-color);
            box-shadow: 0 0 0 3px rgba(112, 107, 99, 0.1);
        }
        .input-hint { margin-top: 7px; color: var(--text-muted); font-size: 0.8rem; }
        .prompt-card {
            margin: 20px 0;
            padding: 22px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 9px;
        }
        .prompt-card h3 {
            font-family: var(--font-serif);
            font-size: 1.12rem;
            font-weight: 600;
            margin-bottom: 14px;
            color: var(--accent);
        }
        .prompt-box {
            min-height: 110px;
            background: var(--surface-color);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            margin-bottom: 14px;
        }
        #promptInstruction { min-height: 700px; }
        #promptDescription { min-height: 400px; }
        .copy-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 18px;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }
        .copy-btn:hover { background: var(--accent-hover); }
        .copy-btn:active { transform: translateY(1px); }
        .copy-btn.copied { background: var(--success); }
        .doc-footer {
            text-align: center;
            margin-top: 44px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
        @media (max-width: 640px) {
            body { padding: 12px 8px; }
            .document-container { padding: 24px 16px; }
            .doc-title { font-size: 1.8rem; }
            .prompt-card { padding: 16px; }
            #promptInstruction { min-height: 780px; }
        }
    </style>
</head>
<body>
    <main class="document-container">
        <header class="doc-header">
            <h1 class="doc-title">Ice Cold Traffic Project</h1>
            <p class="doc-subtitle">(to promote digital product)</p>
        </header>

        <section aria-labelledby="variables-heading">
            <h2 class="section-heading" id="variables-heading">Product Input</h2>
            <div class="input-group">
                <label class="input-label" for="productName">Product Name</label>
                <textarea id="productName" class="doc-input" placeholder="Enter the digital product name" oninput="updatePrompts()" rows="3"></textarea>
                <p class="input-hint">This multiline field fills the product name in Prompt #1 and Prompt #2.</p>
            </div>
        </section>

        <section aria-labelledby="prompts-heading">
            <h2 class="section-heading" id="prompts-heading">Prompts</h2>

            <article class="prompt-card">
                <h3>Prompt #1 (Project name)</h3>
                <textarea id="promptProjectName" class="prompt-box" aria-label="Prompt 1 project name" readonly></textarea>
                <button class="copy-btn" type="button" onclick="copyPrompt('promptProjectName', this)">Copy Prompt #1</button>
            </article>

            <article class="prompt-card">
                <h3>Prompt #2 (Instruction)</h3>
                <textarea id="promptInstruction" class="prompt-box" aria-label="Prompt 2 instruction" readonly></textarea>
                <button class="copy-btn" type="button" onclick="copyPrompt('promptInstruction', this)">Copy Prompt #2</button>
            </article>

            <article class="prompt-card">
                <h3>Prompt #3</h3>
                <textarea id="promptDescription" class="prompt-box" aria-label="Prompt 3" readonly></textarea>
                <button class="copy-btn" type="button" onclick="copyPrompt('promptDescription', this)">Copy Prompt #3</button>
            </article>
        </section>

        <footer class="doc-footer">
            Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.
        </footer>
    </main>

    <script>
        const instructionTemplate = `এই Project-এ একটি নির্দিষ্ট Digital Product-এর promotion নিয়ে কাজ করা হবে।

Project-এ upload করা Digital Product-কে এই Product-এর primary source of truth হিসেবে বিবেচনা করুন। Product-এর contents, features, structure, mechanism, intended use, scope এবং অন্যান্য তথ্য সম্পর্কে যা সরাসরি Product থেকে জানা যায়, শুধুমাত্র সেটাই Product fact হিসেবে ব্যবহার করুন। Product থেকে জানা যায় না এমন তথ্য অনুমান করে তৈরি করবেন না।

এই Project-এ আমি একটি Prompt Generation App থেকে তৈরি করা এক বা একাধিক marketing prompt ব্যবহার করব। Generated prompt-গুলোকে fixed execution prompt হিসেবে বিবেচনা করুন।

আমি যে generated prompt দেব, তার wording, structure, instructions, requirements বা intended process নিজে থেকে পরিবর্তন, rewrite, shorten, expand, optimize বা improve করবেন না।

আমি কোনও generated prompt ব্যবহার করতে বললে, সেটির instruction অনুযায়ী কাজ করুন এবং Project-এ থাকা Digital Product-এর relevant context ব্যবহার করুন।

Generated prompt-এর execution-এর জন্য অতিরিক্ত input প্রয়োজন হলে শুধুমাত্র প্রয়োজনীয় input চাইতে পারেন। তবে মূল generated prompt পরিবর্তন করবেন না।

Digital Product-এ কোনও তথ্য না থাকলে সেটি নিজের থেকে তৈরি করবেন না। প্রয়োজন হলে স্পষ্টভাবে বলুন যে তথ্যটি available নয়।

Product-এর কোনও feature, capability বা supported outcome-কে guaranteed result হিসেবে উপস্থাপন করবেন না, যদি Product বা supplied source-এ তা স্পষ্টভাবে guaranteed না করা থাকে।

Product-এর promotion সম্পর্কিত কাজের ক্ষেত্রে Product-এর প্রকৃত content এবং supplied information-এর সঙ্গে সামঞ্জস্য বজায় রাখুন। এমন claim, feature, benefit, proof, testimonial, price, guarantee, result বা commercial detail তৈরি করবেন না যার ভিত্তি supplied source-এ নেই।

আমি যদি কোনও generated prompt-এর output চাই, তাহলে prompt-টি analyse বা redesign করার পরিবর্তে সরাসরি তার intended task execute করুন।

আমি স্পষ্টভাবে prompt modification, optimisation বা redesign চাইলে তবেই generated prompt পরিবর্তন করুন।

এই Project-এর মূল workflow হলো:

Digital Product
→ Product Context
→ Generated Marketing Prompt
→ Prompt Execution
→ Marketing Output`;

        const descriptionPrompt = `আপলোড করা Digital Product PDF-টি সম্পূর্ণভাবে পর্যালোচনা করুন এবং শুধুমাত্র PDF-এ থাকা তথ্যের ভিত্তিতে একটি comprehensive Product Description তৈরি করুন।

এই Product Description-টি একটি marketing prompt generation application-এর “Offer Description” input field-এ সরাসরি ব্যবহার করা হবে। তাই description-টি promotional কাজের জন্য যথেষ্ট informative হবে, কিন্তু unsupported marketing claim তৈরি করবে না।

PDF থেকে প্রয়োজনীয় তথ্য শনাক্ত করে নিচের structure অনুযায়ী Product Description তৈরি করুন।

Product Name:
PDF-এ product-এর যে নাম দেওয়া আছে, সেটি ব্যবহার করুন।

What it is:
Product-টি আসলে কী, কী ধরনের digital product এবং এর মূল উদ্দেশ্য কী—সংক্ষেপে ও পরিষ্কারভাবে লিখুন।

What is included:
Product-এর মধ্যে বাস্তবে কী কী আছে, তার একটি comprehensive list দিন`;

        function updatePrompts() {
            const productName = document.getElementById('productName').value;
            document.getElementById('promptProjectName').value = `${productName} ICT`;
            document.getElementById('promptInstruction').value = instructionTemplate;
            document.getElementById('promptDescription').value = descriptionPrompt;
        }

        async function copyPrompt(id, button) {
            const text = document.getElementById(id).value;
            try {
                await navigator.clipboard.writeText(text);
            } catch (error) {
                const field = document.getElementById(id);
                field.focus();
                field.select();
                document.execCommand('copy');
                field.setSelectionRange(0, 0);
            }
            const originalText = button.textContent;
            button.textContent = '✓ Copied!';
            button.classList.add('copied');
            window.setTimeout(() => {
                button.textContent = originalText;
                button.classList.remove('copied');
            }, 1800);
        }

        updatePrompts();
    </script>
</body>
</html>
